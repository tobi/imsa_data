name: Auto Import IMSA Data

on:
  schedule:
    - cron: '0 13 * * 1'   # Every Monday at 8 AM EST (after races)
  workflow_dispatch:       # allows manual trigger too

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    environment: HF

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true  

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' 

      - name: Install DuckDB
        run: |
          wget https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip
          unzip duckdb_cli-linux-amd64.zip
          sudo mv duckdb /usr/local/bin/
          chmod +x /usr/local/bin/duckdb

      - name: Run import task
        run: ruby import.rb

      - name: Install Hugging Face CLI
        run: |
          pip install huggingface_hub
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Publish to Hugging Face
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          hf auth login --token $HUGGINGFACE_TOKEN
          rake publish

      - name: Commit & push if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Automated import: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            git push
          fi
