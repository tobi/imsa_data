name: Verify Pages retirement status
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --include repos/tobi/imsa_data/pages
      - name: Check public site response
        if: ${{ always() }}
        run: |
          curl --silent --show-error --location --max-time 30 --dump-header /tmp/pages-headers --output /tmp/pages-body --write-out 'Public site HTTP %{http_code}\nFinal URL %{url_effective}\n' https://tobi.github.io/imsa_data/
          cat /tmp/pages-headers
          head -c 300 /tmp/pages-body
