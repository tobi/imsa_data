name: Data validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install DuckDB
        run: |
          curl -fsSL https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip -o /tmp/duckdb.zip
          unzip /tmp/duckdb.zip -d /tmp/duckdb-cli
          sudo install /tmp/duckdb-cli/duckdb /usr/local/bin/duckdb
      - name: Clean database build
        run: rake clean db:update
      - name: Data coverage summary
        run: duckdb output/imsa.duckdb < scripts/data_quality_summary.sql
      - name: Full tests
        if: ${{ !cancelled() }}
        run: rake test
      - name: Data quality lint
        if: ${{ !cancelled() }}
        run: rake lint_data lint_drivers
